<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF085" />
      <stop offset="25%" stop-color="#FFC700" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="goldSheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Metallic Steel Gradients for Barbell & Plates -->
    <linearGradient id="plateSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3F3F46" />
      <stop offset="25%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="75%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>

    <linearGradient id="plateRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#B45309" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.9" />
    </linearGradient>

    <!-- Bar gradient -->
    <linearGradient id="barbellBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#71717A" />
      <stop offset="35%" stop-color="#E4E4E7" />
      <stop offset="65%" stop-color="#A1A1AA" />
      <stop offset="100%" stop-color="#27272A" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Carbon Pattern / Solid -->
  <rect width="600" height="600" fill="#0A0B0E" rx="36" />
  <circle cx="300" cy="300" r="260" fill="#FFC700" opacity="0.03" />

  <!-- BARBELL BAR EXTENSIONS (Left and Right) -->
  <g filter="url(#dropShadow)">
    <!-- Central Bar Behind Shield -->
    <rect x="40" y="288" width="520" height="24" rx="4" fill="url(#barbellBar)" stroke="#18181B" stroke-width="2" />
    <rect x="40" y="295" width="520" height="4" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- LEFT BARBELL PLATES -->
  <g id="leftPlates" filter="url(#dropShadow)">
    <!-- Outer Plate (Large) -->
    <rect x="75" y="195" width="28" height="210" rx="10" fill="url(#plateSteel)" stroke="url(#plateRim)" stroke-width="2.5" />
    <rect x="83" y="210" width="12" height="180" rx="4" fill="#18181B" stroke="#3F3F46" stroke-width="1" />
    
    <!-- Middle Plate -->
    <rect x="108" y="215" width="24" height="170" rx="8" fill="url(#plateSteel)" stroke="url(#plateRim)" stroke-width="2" />
    <rect x="115" y="228" width="10" height="144" rx="3" fill="#18181B" stroke="#3F3F46" stroke-width="1" />

    <!-- Inner Plate (Lock Collar) -->
    <rect x="136" y="250" width="16" height="100" rx="5" fill="url(#plateSteel)" stroke="url(#plateRim)" stroke-width="1.5" />
    <!-- Collar bolt -->
    <circle cx="144" cy="300" r="4" fill="#FFC700" />
  </g>

  <!-- RIGHT BARBELL PLATES -->
  <g id="rightPlates" filter="url(#dropShadow)">
    <!-- Inner Plate (Lock Collar) -->
    <rect x="448" y="250" width="16" height="100" rx="5" fill="url(#plateSteel)" stroke="url(#plateRim)" stroke-width="1.5" />
    <circle cx="456" cy="300" r="4" fill="#FFC700" />

    <!-- Middle Plate -->
    <rect x="468" y="215" width="24" height="170" rx="8" fill="url(#plateSteel)" stroke="url(#plateRim)" stroke-width="2" />
    <rect x="475" y="228" width="10" height="144" rx="3" fill="#18181B" stroke="#3F3F46" stroke-width="1" />

    <!-- Outer Plate (Large) -->
    <rect x="497" y="195" width="28" height="210" rx="10" fill="url(#plateSteel)" stroke="url(#plateRim)" stroke-width="2.5" />
    <rect x="505" y="210" width="12" height="180" rx="4" fill="#18181B" stroke="#3F3F46" stroke-width="1" />
  </g>

  <!-- CENTRAL CREST / SHIELD CONTAINER -->
  <g id="centralShield" filter="url(#dropShadow)">
    <!-- Outer Golden Trim Layer -->
    <polygon points="300,90 460,185 435,420 300,510 165,420 140,185"
      fill="#0F1015" stroke="url(#goldLinear)" stroke-width="6" stroke-linejoin="round" />

    <!-- Inner Dark Beveled Surface -->
    <polygon points="300,104 446,192 423,410 300,494 177,410 154,192"
      fill="#14161F" stroke="#232736" stroke-width="2" stroke-linejoin="round" />

    <!-- Subtle shield highlights -->
    <polygon points="300,104 446,192 300,494" fill="#FFFFFF" opacity="0.02" />
  </g>

  <!-- MONOGRAM "HA" (Helmans Academy) -->
  <g id="monogramHA" filter="url(#dropShadow)">
    <!-- Left Wing / 'H' Left Pillar -->
    <polygon points="185,190 235,190 235,410 185,385" 
             fill="url(#goldLinear)" stroke="#111" stroke-width="2" stroke-linejoin="round" />
    <!-- 'H' Crossbar & Connector -->
    <polygon points="235,275 320,275 320,320 235,320" 
             fill="url(#goldSheen)" stroke="#111" stroke-width="2" />

    <!-- Middle Pillar / 'H' Right & 'A' Left Overlap -->
    <polygon points="275,190 325,190 325,445 275,415" 
             fill="url(#goldLinear)" stroke="#111" stroke-width="2" stroke-linejoin="round" />

    <!-- 'A' Top Peak & Right Wing -->
    <polygon points="335,190 415,190 375,415 325,415 365,245 335,245" 
             fill="url(#goldLinear)" stroke="#111" stroke-width="2" stroke-linejoin="round" />

    <!-- 'A' Inner Cross Slot -->
    <polygon points="335,310 395,310 385,350 335,350" 
             fill="url(#goldSheen)" stroke="#111" stroke-width="2" />

    <!-- Central Chevron Tip at the bottom of HA -->
    <polygon points="300,470 275,415 325,415" 
             fill="#FFC700" stroke="#111" stroke-width="1.5" />
  </g>

  <!-- BOTTOM RIBBON BANNERS ("ACADEMIA" & "FITNESS") -->
  <g id="banners" filter="url(#dropShadow)">
    <!-- Left Banner ("ACADEMIA") -->
    <polygon points="150,425 285,485 275,520 135,455" 
             fill="#181A24" stroke="url(#goldLinear)" stroke-width="2.5" stroke-linejoin="round" />
    <text x="210" y="476" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="20" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="3" 
          fill="url(#goldLinear)" 
          text-anchor="middle" 
          transform="rotate(23, 210, 476)">ACADEMIA</text>

    <!-- Right Banner ("FITNESS") -->
    <polygon points="450,425 315,485 325,520 465,455" 
             fill="#181A24" stroke="url(#goldLinear)" stroke-width="2.5" stroke-linejoin="round" />
    <text x="390" y="476" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="20" 
          font-weight="900" 
          font-style="italic" 
          letter-spacing="3" 
          fill="url(#goldLinear)" 
          text-anchor="middle" 
          transform="rotate(-23, 390, 476)">FITNESS</text>
  </g>

  <!-- Golden Stars & Apex Details -->
  <g id="apexDetails" fill="url(#goldLinear)">
    <!-- Top Crown Star -->
    <polygon points="300,115 305,127 318,128 308,136 311,148 300,141 289,148 292,136 282,128 295,127" />
  </g>
</svg>
